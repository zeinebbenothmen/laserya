<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Démo — Aperçu gravure en direct | Laserya</title>

<!-- Polices script (équivalents gratuits proches de ta gravure) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Allura&family=Dancing+Script:wght@500;700&family=Parisienne&display=swap" rel="stylesheet">

<style>
  :root{
    --glow: #cdeaff;          /* couleur de la lumière LED */
    --glow-soft: rgba(168,232,255,.85);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    background:#0a0e13;
    color:#e0e2ea;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }
  h1{font-size:20px;font-weight:700;margin-bottom:4px;color:#a8e8ff}
  .sub{color:#8b95a0;font-size:13px;margin-bottom:28px;text-align:center}

  /* ---------- LA PLAQUE (recréée en CSS, aucune photo nécessaire) ---------- */
  .scene{
    width:100%;
    max-width:440px;
    aspect-ratio:4/4.4;
    border-radius:18px;
    background:
      radial-gradient(120% 80% at 50% 30%, rgba(40,90,120,.35), transparent 60%),
      linear-gradient(180deg,#0c1a22 0%, #06212b 55%, #04161d 100%);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:inset 0 0 80px rgba(0,0,0,.6);
  }
  /* halo lumineux derrière la plaque */
  .halo{
    position:absolute;
    bottom:8%;
    width:70%;
    height:60%;
    background:var(--glow-soft);
    filter:blur(70px);
    opacity:.28;
    border-radius:50%;
    z-index:0;
  }
  /* la feuille acrylique transparente */
  .plate{
    position:relative;
    z-index:1;
    width:78%;
    height:80%;
    border:2px solid rgba(168,232,255,.45);
    border-radius:10px 10px 4px 4px;
    background:linear-gradient(135deg, rgba(168,232,255,.06), rgba(168,232,255,.02));
    box-shadow:
      0 0 18px rgba(168,232,255,.25),
      inset 0 0 30px rgba(168,232,255,.06);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6%;
    padding:8%;
    backdrop-filter:blur(1px);
  }
  /* socle éclairé */
  .base{
    position:absolute;
    bottom:6%;
    z-index:2;
    width:46%;
    height:5%;
    background:linear-gradient(180deg,#1b2730,#0c151b);
    border:1px solid rgba(168,232,255,.25);
    border-radius:6px;
    box-shadow:0 0 25px rgba(168,232,255,.35);
  }

  /* ---------- LE TEXTE GRAVÉ LUMINEUX ---------- */
  .engrave{
    color:#eaf7ff;
    text-align:center;
    line-height:1.05;
    -webkit-user-select:none;user-select:none;
    /* l'effet "brillant LED" : plusieurs ombres lumineuses superposées */
    text-shadow:
      0 0 4px #fff,
      0 0 10px var(--glow),
      0 0 22px var(--glow-soft),
      0 0 40px var(--glow-soft);
  }
  #line1{ font-size:clamp(30px,9vw,46px); }
  #line2{ font-size:clamp(26px,7.5vw,38px); }

  /* ---------- PANNEAU DE CONTRÔLE ---------- */
  .panel{width:100%;max-width:440px;margin-top:26px;display:flex;flex-direction:column;gap:18px}
  label{display:block;font-size:13px;color:#a1a1aa;margin-bottom:7px;font-weight:600}
  input[type=text]{
    width:100%;padding:13px 15px;border-radius:10px;
    background:#101921;border:1px solid #243240;color:#fff;font-size:15px;
    transition:.2s;
  }
  input[type=text]:focus{outline:none;border-color:#a8e8ff;box-shadow:0 0 0 3px rgba(168,232,255,.15)}

  .fonts{display:flex;flex-wrap:wrap;gap:8px}
  .fonts button{
    padding:9px 14px;border-radius:999px;cursor:pointer;font-size:14px;
    background:#101921;border:1px solid #243240;color:#cbd5e1;transition:.15s;
  }
  .fonts button.active{border-color:#a8e8ff;background:rgba(168,232,255,.12);color:#a8e8ff;font-weight:700}

  .colors{display:flex;gap:12px}
  .colors button{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid #243240;transition:.15s}
  .colors button.active{border-color:#fff;transform:scale(1.1)}
</style>
</head>
<body>

  <h1>Aperçu gravure en direct</h1>
  <p class="sub">Tape un nom — il s'affiche sur la plaque, gravé et lumineux. Aucune photo réelle modifiée : tout est généré.</p>

  <!-- L'APERÇU -->
  <div class="scene">
    <div class="halo" id="halo"></div>
    <div class="plate">
      <div class="engrave" id="line1" style="font-family:'Great Vibes',cursive">Docteur</div>
      <div class="engrave" id="line2" style="font-family:'Great Vibes',cursive">Tarak Friaa</div>
    </div>
    <div class="base"></div>
  </div>

  <!-- LES CONTRÔLES -->
  <div class="panel">
    <div>
      <label>Ligne 1 (titre / prénom)</label>
      <input type="text" id="in1" maxlength="20" value="Docteur" placeholder="Ex: Docteur">
    </div>
    <div>
      <label>Ligne 2 (nom)</label>
      <input type="text" id="in2" maxlength="22" value="Tarak Friaa" placeholder="Ex: Morad">
    </div>
    <div>
      <label>Style d'écriture</label>
      <div class="fonts" id="fonts">
        <button class="active" data-font="'Great Vibes',cursive">Élégant</button>
        <button data-font="'Allura',cursive">Fin</button>
        <button data-font="'Parisienne',cursive">Manuscrit</button>
        <button data-font="'Dancing Script',cursive">Décontracté</button>
      </div>
    </div>
    <div>
      <label>Couleur de la lumière</label>
      <div class="colors" id="colors">
        <button class="active" data-glow="#cdeaff" data-soft="rgba(168,232,255,.85)" style="background:#cdeaff"></button>
        <button data-glow="#ffffff" data-soft="rgba(255,255,255,.9)" style="background:#ffffff"></button>
        <button data-glow="#b6ffd0" data-soft="rgba(120,255,170,.85)" style="background:#b6ffd0"></button>
        <button data-glow="#ffd9a8" data-soft="rgba(255,190,110,.85)" style="background:#ffd9a8"></button>
        <button data-glow="#ffb6e1" data-soft="rgba(255,140,210,.85)" style="background:#ffb6e1"></button>
      </div>
    </div>
  </div>

<script>
  const line1 = document.getElementById('line1');
  const line2 = document.getElementById('line2');
  const in1   = document.getElementById('in1');
  const in2   = document.getElementById('in2');

  in1.addEventListener('input', () => line1.textContent = in1.value || ' ');
  in2.addEventListener('input', () => line2.textContent = in2.value || ' ');

  // Choix de la police
  document.querySelectorAll('#fonts button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#fonts button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      line1.style.fontFamily = btn.dataset.font;
      line2.style.fontFamily = btn.dataset.font;
    });
  });

  // Choix de la couleur de lumière
  document.querySelectorAll('#colors button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#colors button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.documentElement.style.setProperty('--glow', btn.dataset.glow);
      document.documentElement.style.setProperty('--glow-soft', btn.dataset.soft);
    });
  });
</script>
</body>
</html>
