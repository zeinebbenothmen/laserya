<!DOCTYPE html><html class="" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Mes favoris | Laserya.tn</title>
<link rel="stylesheet" href="/assets/css/tailwind-public.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
  body { background:#070A0F; color:#e0e2ea; -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .glass-card { background:rgba(22,27,34,.7); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.08); }
  .glass-panel { background:rgba(22,27,34,.7); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.08); }
</style>
<link href="/assets/css/theme.css" rel="stylesheet"/>
<script src="/assets/js/theme.js"></script>
</head>
<body class="bg-surface-deep text-on-surface selection:bg-primary/30">
<!-- TopNavBar -->
<nav class="fixed top-0 w-full z-[100] bg-surface-dim/80 backdrop-blur-xl border-b border-border-glass">
  <div class="max-w-7xl mx-auto px-gutter h-20 flex items-center justify-between">
    <a href="/index.html" class="flex items-center gap-3">
      <img src="/assets/images/logo.png" alt="Laserya.tn" class="h-9 w-9 rounded-lg object-cover flex-shrink-0"/>
      <span class="hidden sm:inline font-extrabold text-on-surface text-xl tracking-tight" style="font-family:Sora,sans-serif">Laserya.tn</span>
    </a>
    <div class="hidden xl:flex items-center gap-6">
      <a href="/index.html" class="text-on-surface-variant font-label-md hover:text-primary transition-all">Accueil</a>
      <a href="/pages/shop.html" class="text-on-surface-variant font-label-md hover:text-primary transition-all">Boutique</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors font-label-md text-label-md" href="/pages/collections.html">Collections</a>
      <a href="/pages/custom-order.html" class="text-on-surface-variant font-label-md hover:text-primary transition-all">Commande sur mesure</a>
      <a href="/pages/gift-ideas.html" class="text-on-surface-variant font-label-md hover:text-primary transition-all">Idées cadeaux</a>
      <a href="/pages/my-orders.html" class="text-on-surface-variant font-label-md hover:text-primary transition-all">Suivi commande</a>
      <a href="/pages/contact.html" class="text-on-surface-variant font-label-md hover:text-primary transition-all">Contact</a>
    </div>
    <div class="flex items-center gap-2">
      <button class="material-symbols-outlined text-on-surface-variant hover:text-primary p-2 transition-all">search</button>
      <button class="material-symbols-outlined text-primary p-2 transition-all">favorite</button>
      <button class="material-symbols-outlined text-on-surface-variant hover:text-primary p-2 relative transition-all">
        shopping_cart
        <span data-cart-badge class="absolute top-1 right-1 w-4 h-4 bg-primary text-on-primary text-[10px] font-bold rounded-full flex items-center justify-center" style="display:none">0</span>
      </button>
      <button class="material-symbols-outlined text-on-surface-variant hover:text-primary p-2 transition-all">account_circle</button>
    </div>
  </div>
</nav>

<main class="pt-28 pb-20 px-gutter min-h-screen max-w-7xl mx-auto">
  <header class="mb-8">
    <h1 class="font-display-lg text-headline-md text-on-surface mb-2 flex items-center gap-3">
      <span class="material-symbols-outlined text-error" style="font-variation-settings:'FILL' 1">favorite</span>
      Mes favoris
    </h1>
    <p class="text-on-surface-variant font-body-md">Retrouvez les produits que vous avez aimés. Ajoutez-les au panier quand vous voulez.</p>
  </header>
  <div id="wishlist-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div class="col-span-full text-center py-16 text-on-surface-variant">
      <span class="material-symbols-outlined text-4xl block mb-2 animate-spin">progress_activity</span>Chargement…
    </div>
  </div>
</main>

<!-- Decorative glows -->
<div class="fixed top-[15%] right-[-10%] w-[40vw] h-[40vw] bg-primary/5 blur-[120px] rounded-full pointer-events-none z-[-1]"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[30vw] h-[30vw] bg-secondary-container/10 blur-[100px] rounded-full pointer-events-none z-[-1]"></div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/shared.js"></script>
<script>
let allProducts = [];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function emptyState() {
  return `<div class="col-span-full glass-card rounded-2xl p-12 text-center max-w-xl mx-auto">
      <span class="material-symbols-outlined text-5xl text-primary/60 block mb-4">favorite</span>
      <h3 class="font-headline-sm text-headline-sm mb-2">Aucun favori pour l'instant</h3>
      <p class="text-on-surface-variant mb-7">Parcourez la boutique et appuyez sur le ❤️ d'un produit pour le retrouver ici.</p>
      <a href="/pages/shop.html" class="inline-block px-7 py-3 bg-primary text-on-primary rounded-xl font-bold hover:scale-105 transition-all">Découvrir la boutique</a>
    </div>`;
}

function card(p) {
  const img = p.image_url || '/assets/images/placeholder.svg';
  const onSale = Number(p.compare_at_price) > Number(p.price);
  const pct = onSale ? Math.round((1 - Number(p.price) / Number(p.compare_at_price)) * 100) : 0;
  const priceHtml = onSale
    ? `<span class="flex items-baseline gap-2"><span class="text-primary font-bold text-headline-sm">${formatPrice(p.price)}</span><span class="text-on-surface-variant line-through text-label-sm">${formatPrice(p.compare_at_price)}</span></span>`
    : `<span class="text-primary font-bold text-headline-sm">${formatPrice(p.price)}</span>`;
  return `<div class="glass-panel rounded-2xl overflow-hidden group flex flex-col" data-id="${p.id}">
    <div class="relative h-56 overflow-hidden">
      <img class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" src="${img}" alt="${esc(p.name)}" onerror="this.src='/assets/images/placeholder.svg'"/>
      ${onSale ? `<span class="absolute bottom-3 left-3 bg-error text-white text-[11px] font-bold px-2.5 py-1 rounded-full">-${pct}%</span>` : ''}
      <button onclick="removeFav('${p.id}')" title="Retirer des favoris"
        class="absolute top-3 right-3 w-10 h-10 bg-surface-deep/60 backdrop-blur-md rounded-full flex items-center justify-center text-error hover:scale-110 transition-all">
        <span class="material-symbols-outlined text-[20px]" style="font-variation-settings:'FILL' 1">favorite</span>
      </button>
    </div>
    <div class="p-5 flex-grow flex flex-col">
      <h3 class="font-headline-sm text-[17px] text-text-primary leading-tight mb-2 line-clamp-2">${esc(p.name)}</h3>
      <div class="mt-auto">
        <div class="mb-4">${priceHtml}</div>
        <div class="grid grid-cols-2 gap-2">
          <a href="/pages/product.html?id=${p.id}" class="text-center py-2 border border-border-glass rounded-lg text-label-md font-bold hover:bg-white/5 transition-colors">Voir</a>
          <button onclick="addFavToCart('${p.id}')" class="py-2 bg-primary text-on-primary rounded-lg text-label-md font-bold hover:shadow-[0_0_15px_rgba(0,212,255,0.4)] transition-all">Ajouter</button>
        </div>
      </div>
    </div>
  </div>`;
}

function render() {
  const grid = document.getElementById('wishlist-grid');
  const ids = Wishlist.all();
  const favs = allProducts.filter(p => ids.includes(String(p.id)));
  grid.innerHTML = favs.length ? favs.map(card).join('') : emptyState();
}

function removeFav(id) {
  Wishlist.remove(id);
  showToast('Retiré des favoris', 'info');
  render();
}

function addFavToCart(id) {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  Cart.add(p, 1);
  showToast(`"${p.name}" ajouté au panier`, 'success');
}

async function init() {
  try {
    allProducts = await ProductsAPI.getAll();
    render();
  } catch (e) {
    document.getElementById('wishlist-grid').innerHTML = `<div class="col-span-full text-center py-16 text-error">${esc(e.message)}</div>`;
  }
}
init();
</script>
</body></html>
